<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>訪客拜訪 — QRTalkie Cloud</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #fff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --call-green: #16a34a;
      --call-green-hover: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #app {
      width: 100%; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ───── Hero Banner ───── */
    .hero {
      position: relative;
      width: 100%;
      height: 180px;
      background-size: cover;
      background-position: center;
      background-color: #1e3a8a;
      flex-shrink: 0;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(15,23,42,0.7));
    }
    .hero-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 20px 16px;
      max-width: 960px; margin: 0 auto;
      color: #fff;
    }
    .hero-title {
      font-size: 26px; font-weight: 700; letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .hero-subtitle {
      font-size: 13px; opacity: 0.85; margin-top: 4px;
      display: flex; align-items: center; gap: 6px;
    }

    /* ───── Main Content ───── */
    .main {
      flex: 1; width: 100%; max-width: 960px;
      margin: -20px auto 0; padding: 0 16px 40px;
      display: flex; flex-direction: column; gap: 16px;
      position: relative; z-index: 1;
    }

    /* ───── Info Card ───── */
    .info-card {
      background: var(--card-bg); border-radius: 16px;
      padding: 18px 20px; box-shadow: 0 2px 12px rgba(15,23,42,0.06);
      display: flex; align-items: center; gap: 14px;
      border: 1px solid var(--border);
    }
    .info-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: #eff6ff; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 20px;
    }
    .info-text { flex: 1; min-width: 0; }
    .info-label { font-size: 12px; color: var(--text-muted); }
    .info-value { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; }

    /* ───── Building Tabs ───── */
    .tabs-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 4px 0; scrollbar-width: none; -ms-overflow-style: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 10px 20px; border-radius: 10px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text-muted); transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { background: #f8fafc; color: var(--text); }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ───── Search ───── */
    .search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 0 16px; height: 44px;
    }
    .search-box input {
      flex: 1; border: none; outline: none; font-size: 14px;
      color: var(--text); background: transparent;
    }
    .search-box input::placeholder { color: #94a3b8; }
    .search-icon { color: #94a3b8; font-size: 16px; flex-shrink: 0; }

    /* ───── Stats ───── */
    .stats-row {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .stat-pill {
      padding: 6px 14px; border-radius: 999px;
      font-size: 12px; color: var(--text-muted);
      background: var(--card-bg); border: 1px solid var(--border);
      display: flex; align-items: center; gap: 5px;
    }
    .stat-pill strong { color: var(--text); font-weight: 700; }

    /* ───── Room Grid ───── */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }
    .room-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 14px;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; transition: all 0.2s; cursor: default;
    }
    .room-card:hover { box-shadow: 0 8px 24px rgba(15,23,42,0.08); transform: translateY(-2px); }
    .room-number {
      font-size: 22px; font-weight: 700; color: var(--text);
      letter-spacing: 0.03em;
    }
    .room-floor { font-size: 11px; color: #94a3b8; }
    .room-resident { font-size: 12px; color: var(--text-muted); text-align: center; }
    .call-btn {
      width: 100%; height: 38px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--call-green) 0%, var(--call-green-hover) 100%);
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .call-btn:hover { opacity: 0.92; }
    .call-btn:active { transform: scale(0.97); }

    /* ───── Call Feedback ───── */
    .call-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(15,23,42,0.9); color: #fff; padding: 20px 32px;
      border-radius: 14px; font-size: 15px; font-weight: 600;
      z-index: 1000; pointer-events: none; animation: toastIn 0.3s ease-out;
      text-align: center;
    }
    .call-toast .ring-icon { font-size: 40px; margin-bottom: 8px; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.9); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

    /* ───── Empty State ───── */
    .empty-state {
      text-align: center; padding: 48px 20px; color: #94a3b8; font-size: 14px;
    }

    /* ───── Footer ───── */
    .footer {
      text-align: center; padding: 20px; font-size: 11px; color: #94a3b8;
    }

    @media (max-width: 480px) {
      .hero { height: 140px; }
      .hero-title { font-size: 20px; }
      .room-grid { grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); }
      .room-card { padding: 14px 10px; }
      .room-number { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Hero Banner (injected by server) -->
    <div class="hero" id="heroBanner" style="background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&h=300');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-title" id="communityName">載入中...</div>
        <div class="hero-subtitle" id="communityAddr"></div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <!-- Info Card -->
      <div class="info-card">
        <div class="info-icon">🏢</div>
        <div class="info-text">
          <div class="info-label">社區名稱</div>
          <div class="info-value" id="infoName">—</div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <span class="stat-pill">🏗️ 樓宇 <strong id="statBuildings">0</strong></span>
        <span class="stat-pill">🚪 房間 <strong id="statRooms">0</strong></span>
      </div>

      <!-- Building Tabs -->
      <div class="tabs-scroll" id="buildingTabs"></div>

      <!-- Search -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" placeholder="搜尋房間號碼..." id="searchInput" />
      </div>

      <!-- Room Grid -->
      <div id="roomArea">
        <div class="empty-state">載入中...</div>
      </div>

      <!-- Footer -->
      <div class="footer">Powered by QRTalkie Cloud</div>
    </div>

    <!-- Call Feedback Toast -->
    <div id="callToast" style="display:none;"></div>
  </div>

  <script>
    // ─── Configuration ───
    const SLUG = new URLSearchParams(location.search).get('slug') || '';

    // ─── State ───
    let community = null;
    let buildings = [];
    let rooms = [];
    let activeBld = null;

    async function init() {
      if (!SLUG) {
        showError('請提供有效的社區鏈接');
        return;
      }
      try {
        const res = await fetch(`/api/public/visitor/community/${SLUG}`);
        const json = await res.json();
        if (json.code !== 0) throw new Error(json.message || '載入失敗');
        community = json.data;
        buildings = community.buildings || [];
        rooms = community.rooms || [];
        render();
      } catch (e) {
        showError(e.message || '無法載入社區資料');
      }
    }

    function showError(msg) {
      document.getElementById('roomArea').innerHTML = `<div class="empty-state">${esc(msg)}</div>`;
      document.getElementById('communityName').textContent = '錯誤';
    }

    function render() {
      // Hero
      document.getElementById('communityName').textContent = community.name;
      document.getElementById('communityAddr').textContent = community.address || '';
      document.getElementById('infoName').textContent = community.name;
      document.getElementById('statBuildings').textContent = buildings.length;
      document.getElementById('statRooms').textContent = rooms.length;

      // Building Tabs
      const tabsEl = document.getElementById('buildingTabs');
      if (buildings.length <= 1) {
        tabsEl.style.display = 'none';
      } else {
        tabsEl.style.display = '';
        tabsEl.innerHTML = buildings.map(b => {
          const cls = (!activeBld || b.id === activeBld) ? 'active' : '';
          return `<button class="tab-btn ${cls}" data-bid="${b.id}">${esc(b.name)}</button>`;
        }).join('');
        tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            activeBld = Number(btn.dataset.bid);
            renderRooms();
            tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });
      }

      renderRooms();

      // Search
      document.getElementById('searchInput').addEventListener('input', renderRooms);
    }

    function renderRooms() {
      const bid = activeBld || buildings[0]?.id;
      const search = document.getElementById('searchInput')?.value?.trim().toLowerCase() || '';
      let filtered = bid ? rooms.filter(r => r.buildingId === bid) : rooms;
      if (search) {
        filtered = filtered.filter(r => (r.roomNumber || '').toLowerCase().includes(search));
      }

      const area = document.getElementById('roomArea');
      if (filtered.length === 0) {
        area.innerHTML = '<div class="empty-state">暫無房間</div>';
        return;
      }

      area.innerHTML = `<div class="room-grid">${filtered.map(r => `
        <div class="room-card">
          <div class="room-number">${esc(r.roomNumber)}</div>
          ${r.floor ? `<div class="room-floor">📍 ${esc(r.floor)}</div>` : ''}
          ${r.residentName ? `<div class="room-resident">👤 ${esc(r.residentName)}</div>` : ''}
          <button class="call-btn" data-rid="${r.id}" data-rn="${esc(r.roomNumber)}">
            📞 拜訪
          </button>
        </div>
      `).join('')}</div>`;

      // Call button handlers
      area.querySelectorAll('.call-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const rid = btn.dataset.rid;
          const rn = btn.dataset.rn;
          handleCall(rid, rn, btn);
        });
      });
    }

    function handleCall(roomId, roomNumber, btn) {
      // Visual feedback
      btn.textContent = '📞 呼叫中...';
      btn.disabled = true;

      showToast(`正在呼叫「${roomNumber}」...`, `
        <div class="ring-icon">📞</div>
        <div>正在呼叫「${roomNumber}」</div>
        <div style="font-size:12px;font-weight:400;margin-top:4px;opacity:0.8;">請稍候，正在連接...</div>
      `);

      // Placeholder: actual call API integration here
      setTimeout(() => {
        hideToast();
        btn.textContent = '📞 拜訪';
        btn.disabled = false;
      }, 2500);
    }

    function showToast(msg, html) {
      const el = document.getElementById('callToast');
      el.innerHTML = html || msg;
      el.style.display = 'block';
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = 'toastIn 0.3s ease-out';
    }

    function hideToast() {
      const el = document.getElementById('callToast');
      el.style.animation = 'toastOut 0.3s ease-out';
      setTimeout(() => { el.style.display = 'none'; }, 300);
    }

    function esc(s) {
      if (!s) return '';
      const m = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
      return String(s).replace(/[&<>"']/g, c => m[c] || c);
    }

    init();
  </script>
</body>
</html>
