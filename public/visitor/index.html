<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>訪客拜訪 — 太域科技園區</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --call-green: #16a34a;
    }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Noto Sans SC", sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }

    #app {
      width: 100%; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ═══════════════ Hero Banner ═══════════════ */
    .hero {
      position: relative;
      width: 100%;
      height: 220px;
      background: #1e3a8a url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&h=400&q=80') center/cover no-repeat;
      flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .hero::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(15,23,42,0.25) 0%, rgba(15,23,42,0.75) 100%);
    }
    .hero-content {
      position: relative; z-index: 1;
      padding: 28px 24px 24px;
      max-width: 1000px; margin: 0 auto; width: 100%;
      color: #fff;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 11px; font-weight: 500;
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 28px; font-weight: 800; letter-spacing: 0.03em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
      line-height: 1.3;
    }
    .hero-sub {
      font-size: 13px; opacity: 0.8; margin-top: 4px;
    }

    /* ═══════════════ Main Content ═══════════════ */
    .main {
      flex: 1; width: 100%; max-width: 1000px;
      margin: -28px auto 0; padding: 0 20px 48px;
      position: relative; z-index: 2;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ═══════════════ Stats Row ═══════════════ */
    .stats-row {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .stat-card {
      flex: 1; min-width: 90px;
      background: #fff; border-radius: 14px;
      padding: 14px 16px; text-align: center;
      box-shadow: 0 2px 12px rgba(15,23,42,0.05);
      border: 1px solid var(--border-color);
    }
    .stat-card .num { font-size: 24px; font-weight: 800; color: var(--text-main); }
    .stat-card .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ═══════════════ Building Pills ═══════════════ */
    .building-pills {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 2px 0; scrollbar-width: none; -ms-overflow-style: none;
    }
    .building-pills::-webkit-scrollbar { display: none; }
    .pill-btn {
      flex-shrink: 0;
      padding: 11px 22px; border-radius: 999px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1.5px solid var(--border-color);
      background: #fff; color: var(--text-muted);
      transition: all 0.2s; white-space: nowrap;
    }
    .pill-btn:hover { border-color: var(--primary); color: var(--primary); }
    .pill-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(37,99,235,0.25);
    }

    /* ═══════════════ Search ═══════════════ */
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1px solid var(--border-color);
      border-radius: 14px; padding: 0 18px; height: 48px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.04);
    }
    .search-bar input {
      flex: 1; border: none; outline: none; font-size: 14px;
      color: var(--text-main); background: transparent;
    }
    .search-bar input::placeholder { color: #94a3b8; }
    .search-icon { color: #94a3b8; font-size: 18px; flex-shrink: 0; }

    /* ═══════════════ Room Grid ═══════════════ */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
    }
    .room-card {
      background: #fff; border: 1px solid var(--border-color);
      border-radius: 16px; padding: 22px 16px 18px;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; transition: all 0.2s; cursor: default;
      box-shadow: 0 1px 4px rgba(15,23,42,0.03);
      position: relative; overflow: hidden;
    }
    .room-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #e2e8f0 0%, #cbd5e1 100%);
    }
    .room-card:hover {
      box-shadow: 0 8px 28px rgba(15,23,42,0.1);
      transform: translateY(-2px);
    }
    .room-card:hover::before {
      background: linear-gradient(90deg, var(--primary) 0%, #06b6d4 100%);
    }
    .room-number {
      font-size: 22px; font-weight: 800; color: var(--text-main);
      letter-spacing: 0.02em;
    }
    .room-floor {
      font-size: 11px; font-weight: 500;
      color: #fff; background: #94a3b8;
      padding: 2px 10px; border-radius: 999px;
    }
    .room-resident {
      font-size: 12px; color: var(--text-muted);
      text-align: center; min-height: 18px;
    }
    .visit-btn {
      width: 100%; height: 40px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s; margin-top: 4px;
      box-shadow: 0 4px 12px rgba(22,163,74,0.2);
    }
    .visit-btn:hover { opacity: 0.92; transform: scale(1.02); }
    .visit-btn:active { transform: scale(0.97); }
    .visit-btn.calling {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 4px 12px rgba(245,158,11,0.3);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ═══════════════ Toast ═══════════════ */
    .toast-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(15,23,42,0.5);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .toast-card {
      background: #fff; border-radius: 20px; padding: 32px 28px;
      text-align: center; max-width: 320px; width: 85%;
      box-shadow: 0 20px 60px rgba(15,23,42,0.2);
    }
    .toast-icon {
      font-size: 48px; margin-bottom: 12px;
      animation: bounce 0.6s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    .toast-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .toast-room { font-size: 28px; font-weight: 800; color: var(--primary); margin: 6px 0; }
    .toast-msg { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .toast-close {
      margin-top: 18px; padding: 10px 32px; border-radius: 10px;
      border: none; background: #f1f5f9; color: var(--text-muted);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .toast-close:hover { background: #e2e8f0; }

    /* ═══════════════ Empty / Footer ═══════════════ */
    .empty {
      text-align: center; padding: 48px 20px;
      color: #94a3b8; font-size: 14px;
    }
    .footer {
      text-align: center; padding: 12px 20px 24px;
      font-size: 11px; color: #94a3b8;
    }

    @media (max-width: 480px) {
      .hero { height: 180px; }
      .hero-title { font-size: 22px; }
      .room-grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
      .room-card { padding: 16px 12px 14px; }
      .room-number { font-size: 18px; }
      .stat-card { min-width: 70px; padding: 12px 10px; }
      .stat-card .num { font-size: 20px; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- ═══ Hero Banner ═══ -->
  <div class="hero">
    <div class="hero-content">
      <div class="hero-badge">🏢 訪客拜訪系統</div>
      <div class="hero-title">太域科技園區</div>
      <div class="hero-sub">📍 香港九龍灣宏照道 39 號企業廣場三期 6 樓</div>
    </div>
  </div>

  <!-- ═══ Main Content ═══ -->
  <div class="main">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="num">3</div><div class="lbl">棟樓宇</div></div>
      <div class="stat-card"><div class="num">28</div><div class="lbl">個房間</div></div>
      <div class="stat-card"><div class="num">5</div><div class="lbl">個入口</div></div>
    </div>

    <!-- Building Pills -->
    <div class="building-pills">
      <button class="pill-btn active">🏗️ A 座</button>
      <button class="pill-btn">🏗️ B 座</button>
      <button class="pill-btn">🏗️ C 座</button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="search" placeholder="搜尋房間號碼..." />
    </div>

    <!-- Room Grid -->
    <div class="room-grid">
      <div class="room-card">
        <div class="room-number">A101</div>
        <div class="room-floor">1F</div>
        <div class="room-resident">👤 陳大文</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A101', '陳大文')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A102</div>
        <div class="room-floor">1F</div>
        <div class="room-resident">👤 李小華</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A102', '李小華')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A103</div>
        <div class="room-floor">1F</div>
        <div class="room-resident">👤 王小明</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A103', '王小明')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A201</div>
        <div class="room-floor">2F</div>
        <div class="room-resident">👤 張美麗</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A201', '張美麗')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A202</div>
        <div class="room-floor">2F</div>
        <div class="room-resident">👤 劉德華</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A202', '劉德華')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A301</div>
        <div class="room-floor">3F</div>
        <div class="room-resident">👤 周杰倫</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A301', '周杰倫')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A302</div>
        <div class="room-floor">3F</div>
        <div class="room-resident"></div>
        <button class="visit-btn" onclick="handleVisit(this, 'A302', '')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A303</div>
        <div class="room-floor">3F</div>
        <div class="room-resident">👤 林志玲</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A303', '林志玲')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A401</div>
        <div class="room-floor">4F</div>
        <div class="room-resident">👤 蔡依林</div>
        <button class="visit-btn" onclick="handleVisit(this, 'A401', '蔡依林')">
          📞 拜訪
        </button>
      </div>
      <div class="room-card">
        <div class="room-number">A402</div>
        <div class="room-floor">4F</div>
        <div class="room-resident"></div>
        <button class="visit-btn" onclick="handleVisit(this, 'A402', '')">
          📞 拜訪
        </button>
      </div>
    </div>

    <div class="footer">Powered by QRTalkie Cloud · 門禁管理系統</div>
  </div>
</div>

<!-- ═══ Call Toast ═══ -->
<div class="toast-overlay" id="toast" style="display:none" onclick="hideToast()">
  <div class="toast-card" onclick="event.stopPropagation()">
    <div class="toast-icon">📞</div>
    <div class="toast-title">正在呼叫</div>
    <div class="toast-room" id="toastRoom">—</div>
    <div class="toast-msg" id="toastMsg">請稍候，正在連接...</div>
    <button class="toast-close" onclick="hideToast()">關閉</button>
  </div>
</div>

<script>
  const pillBtns = document.querySelectorAll('.pill-btn');
  pillBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      pillBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  function handleVisit(btn, room, resident) {
    btn.classList.add('calling');
    btn.innerHTML = '📞 呼叫中...';

    document.getElementById('toastRoom').textContent = room;
    document.getElementById('toastMsg').textContent = resident ? `住戶：${resident}` : '請稍候，正在連接...';
    document.getElementById('toast').style.display = '';

    setTimeout(() => {
      btn.classList.remove('calling');
      btn.innerHTML = '📞 拜訪';
      hideToast();
    }, 3000);
  }

  function hideToast() {
    document.getElementById('toast').style.display = 'none';
    document.querySelectorAll('.visit-btn.calling').forEach(b => {
      b.classList.remove('calling');
      b.innerHTML = '📞 拜訪';
    });
  }
</script>
</body>
</html>
