<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRTalkie Cloud</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <template id="static-prototype">

      <div class="app-shell hidden" id="console">
        <aside class="sidebar" aria-label="主導覽">
          <div class="brand">
            <span class="brand-mark"><img src="/assets/qrtalkie-logo.svg" alt="QRTalkie Cloud" /></span>
            <div>
              <strong>QRTalkie Cloud</strong>
              <span>註冊管理控制台</span>
            </div>
          </div>

          <nav class="nav">
            <button class="nav-item active" data-view="dashboard"><span>首頁</span></button>
            <button class="nav-item" data-view="users"><span>SIP 使用者</span></button>
            <button class="nav-item" data-view="registrations"><span>註冊狀態</span></button>
            <button class="nav-item" data-view="domain"><span>套餐管理</span></button>
            <button class="nav-item" data-view="tenant"><span>租戶設定</span></button>
            <button class="nav-item logout-item" id="logout-system" type="button"><span>退出系統</span></button>
          </nav>

          <div class="sidebar-foot">
            <span>目前租戶</span>
            <strong>Acme Voice</strong>
            <small data-sip-domain>sip.qrtalkie.org</small>
          </div>
        </aside>

        <main class="main">
          <header class="topbar">
            <div><h1 id="page-title">控制台</h1></div>
            <button class="ghost-btn hidden" id="back-to-billing-top" type="button">返回套餐管理</button>
            <button class="primary-btn hidden" id="open-purchase-plan" type="button">購買套餐</button>
            <button class="primary-btn" id="open-create-user">建立使用者</button>
          </header>
        </main>
      </div>

      <dialog id="legal-dialog">
        <form method="dialog" class="dialog-card legal-card">
          <div class="panel-head">
            <h2 id="legal-title">會員服務條款</h2>
            <button class="icon-btn" value="cancel" title="關閉">x</button>
          </div>
          <div class="legal-content" id="legal-content"></div>
          <button class="primary-btn" value="default">我知道了</button>
        </form>
      </dialog>

      <div class="floating-order-menu hidden" id="floating-order-menu"></div>
    </template>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
