<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cloud.qrtalkie.org
    ServerAlias ecard.qrtalkie.org

    DocumentRoot /opt/saas/dist

    <Directory /opt/saas/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    Alias /visitor-assets/ /opt/saas/dist/visitor/
    Alias /payment-method-icons/ /opt/saas/assets/payment-method-icons/

    <Directory /opt/saas/dist/visitor>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <Directory /opt/saas/assets/payment-method-icons>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    <Files "access-platform.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    <Files "access-visitor-call.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPass /access/ http://127.0.0.1:3001/access/
    ProxyPassReverse /access/ http://127.0.0.1:3001/access/
    ProxyPass /ecard-images/ http://127.0.0.1:3001/ecard-images/
    ProxyPassReverse /ecard-images/ http://127.0.0.1:3001/ecard-images/
    ProxyPass /api/ecard-images/ http://127.0.0.1:3001/api/ecard-images/
    ProxyPassReverse /api/ecard-images/ http://127.0.0.1:3001/api/ecard-images/
    ProxyPass /privacy-terms/ http://127.0.0.1:3001/privacy-terms/
    ProxyPassReverse /privacy-terms/ http://127.0.0.1:3001/privacy-terms/

    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/access/visitor/?$ [OR]
    RewriteCond %{REQUEST_URI} ^/visitor-assets/ [OR]
    RewriteCond %{REQUEST_URI} ^/payment-method-icons/ [OR]
    RewriteCond %{REQUEST_URI} ^/api/ [OR]
    RewriteCond %{REQUEST_URI} ^/assets/ [OR]
    RewriteCond %{REQUEST_URI} ^/ecard-images/ [OR]
    RewriteCond %{REQUEST_URI} ^/privacy-terms/ [OR]
    RewriteCond %{REQUEST_URI} ^/api/ecard-images/ [OR]
    RewriteCond %{REQUEST_URI} ^/privacy-terms/ [OR]
    RewriteCond %{REQUEST_URI} ^/favicon\.ico$ [OR]
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ /index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/cloud_ecard_qrtalkie_error.log
    CustomLog ${APACHE_LOG_DIR}/cloud_ecard_qrtalkie_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/cloud.qrtalkie.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/cloud.qrtalkie.org/privkey.pem
</VirtualHost>
</IfModule>
